<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Green Viagens | Simulador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">Green<span>Viagens</span></div>
        <nav>
            <a href="index.html">Início</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="simulador.html" class="ativo">Simulador</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="sobre.html">Sobre</a>
        </nav>
    </header>

    <main class="container">
        <h2>Simulador de Pacote de Viagem</h2>
        <div class="box-formulario">
            <label>Escolha o Destino:</label>
            <select id="sim-destino" onchange="calcularSimulacao()"></select>

            <label>Quantidade de Adultos:</label>
            <input type="number" id="sim-adultos" value="1" min="1" max="10" onchange="calcularSimulacao()">

            <label>Quantidade de Crianças (50% de desconto):</label>
            <input type="number" id="sim-criancas" value="0" min="0" max="10" onchange="calcularSimulacao()">

            <label>Classe do Voo:</label>
            <select id="sim-classe" onchange="calcularSimulacao()">
                <option value="1">Econômica (Padrão)</option>
                <option value="1.5">Executiva (+50%)</option>
            </select>

            <div class="resultado-box">
                <p>Valor Total Estimado:</p>
                <h3 id="sim-total">R$ 0,00</h3>
            </div>

            <button class="btn-detalhes" onclick="irParaCadastro()">Avançar para Cadastro e Reserva &rarr;</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
